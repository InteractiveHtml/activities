<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aleks' Interactive Code Pieces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#9ae2e0;
    --purple:#390070;
    --pink:#d22176;
    --card-bg:#ffffff;
    --text-sub:#2f2f38;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:var(--text-sub);
    min-height:100vh;
  }
  .wrap{
    max-width:680px;
    margin:0 auto;
    padding:64px 20px 80px;
  }
  h1{
    font-weight:800;
    font-size:2.6rem;
    line-height:1.15;
    color:var(--purple);
    margin:0 0 12px;
    text-wrap:balance;
  }
  .sub{
    font-weight:500;
    font-size:1.05rem;
    color:var(--text-sub);
    margin:0 0 40px;
    max-width:52ch;
  }
  h2.section-label{
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--purple);
    margin:0 0 16px;
  }
  ul.activity-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .activity-list a{
    display:block;
    background:var(--card-bg);
    border-radius:12px;
    padding:18px 20px;
    text-decoration:none;
    color:var(--text-sub);
    border:2px solid transparent;
    transition:border-color 0.15s ease, transform 0.15s ease;
  }
  .activity-list a:hover,
  .activity-list a:focus-visible{
    border-color:var(--pink);
    transform:translateY(-1px);
  }
  .activity-title{
    display:block;
    font-weight:700;
    font-size:1.1rem;
    color:var(--purple);
    margin-bottom:4px;
  }
  .activity-note{
    display:block;
    font-weight:500;
    font-size:0.9rem;
    color:var(--text-sub);
    opacity:0.8;
  }
  footer{
    margin-top:48px;
    font-weight:500;
    font-size:0.85rem;
    color:var(--text-sub);
    opacity:0.75;
  }
  @media (max-width:480px){
    .wrap{padding:44px 18px 60px;}
    h1{font-size:2rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Aleks' Interactive Code Pieces</h1>
  <p class="sub">A growing set of interactive activities built for Coassemble courses.</p>

  <h2 class="section-label">Activities</h2>
  <ul class="activity-list">
    <li>
      <a href="https://interactivehtml.github.io/activities/writingapology.html">
        <span class="activity-title">Writing an Apology</span>
        <span class="activity-note">Module 6 activity</span>
      </a>
    </li>
    <li>
      <a href="https://interactivehtml.github.io/activities/AIRM_timeline_1.html">
        <span class="activity-title">AIRM Repair Timeline</span>
        <span class="activity-note">Module 6 &mdash; Repair</span>
      </a>
    </li>
  </ul>

  <footer>More activities will be added here as they're built.</footer>
</div>
</body>
</html>
